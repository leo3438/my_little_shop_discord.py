<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px;
        background: #1e1e2e;
        color: #e6e6e6;
      }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #2a2a3c;
        color: #fff;
        font-size: 13px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #7c4dff;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #6a3ce0; }
      #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Anime-Sama → Jellyfin</h1>
    <label for="backend">Endpoint du backend local</label>
    <input id="backend" type="text" placeholder="http://localhost:8000/api/episode" />
    <button id="save">Enregistrer</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
