services:
  tinfoil-proxy:
    build: .
    image: tinfoil-proxy-aggregator:latest
    container_name: tinfoil-proxy
    # Charge tokens et identifiants depuis le fichier .env (voir .env.example).
    env_file:
      - .env
    # Force le port applicatif à 3001 quel que soit le PORT du .env,
    # afin qu'il corresponde au mapping ci-dessous.
    environment:
      - PORT=3001
    # hôte:conteneur — 3001 côté ZimaOS pour éviter le conflit avec le port 3000.
    ports:
      - "3001:3001"
    # Redémarre automatiquement (démarrage machine, crash…), sauf arrêt manuel.
    restart: unless-stopped
