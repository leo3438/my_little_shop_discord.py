services:
  tinfoil-proxy:
    build: .
    container_name: tinfoil-proxy
    # Variables listées explicitement : renseignez-les dans l'éditeur
    # « Environment variables » de la stack Portainer (pas de fichier .env requis).
    environment:
      # Port applicatif interne, aligné sur le mapping ports ci-dessous.
      - PORT=3001
      # URL publique joignable depuis la Switch, ex. http://IP_DU_ZIMAOS:3001
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      # UltraNX (façon DBI) : identifiants injectés dans le chemin de l'URL.
      - ULTRANX_LOGIN=${ULTRANX_LOGIN}
      - ULTRANX_PASSWORD=${ULTRANX_PASSWORD}
      # Magic Monkei (façon Tinfoil) : authentification HTTP Basic.
      - MAGIC_MONKEI_USER=${MAGIC_MONKEI_USER}
      - MAGIC_MONKEI_PASS=${MAGIC_MONKEI_PASS}
      # Jaquettes IGDB (facultatif). Laisser vide désactive proprement l'appel.
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
    # hôte:conteneur — 3001 côté ZimaOS pour éviter le conflit avec le port 3000.
    ports:
      - "3001:3001"
    # Redémarre automatiquement (démarrage machine, crash…), sauf arrêt manuel.
    restart: unless-stopped
