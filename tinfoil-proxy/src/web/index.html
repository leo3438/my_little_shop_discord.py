<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tinfoil Proxy — Médiathèque</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --border: #2a2f3a;
      --text: #e6e8ec;
      --muted: #9aa3b2;
      --accent: #4f8cff;
      --accent-hover: #3a78f0;
      --ultranx: #8b5cf6;
      --magicmonkei: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #141821, var(--bg));
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .sub { color: var(--muted); font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 60px; }

    .toolbar { display: flex; gap: 10px; align-items: center; margin: 12px 0 16px; flex-wrap: wrap; }
    #filter, #console {
      padding: 9px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
    }
    #filter { flex: 1 1 220px; }
    #console { flex: 0 0 auto; max-width: 220px; cursor: pointer; }
    #filter:focus, #console:focus { outline: none; border-color: var(--accent); }
    .btn {
      display: inline-block; padding: 8px 14px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost:hover { background: var(--border); }

    .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 18px; }
    .crumbs b { color: var(--text); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px; overflow: hidden; }
    thead th {
      text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
      color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600;
    }
    tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--panel-2); }
    .name { word-break: break-word; min-width: 220px; }
    .name .folder { cursor: pointer; color: var(--accent); text-decoration: none; }
    .name .folder:hover { text-decoration: underline; }
    .console-cell { color: var(--muted); white-space: nowrap; }
    .size { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    td.actions { text-align: right; white-space: nowrap; }

    .cover-cell { width: 58px; padding-right: 0; }
    .cover-img {
      width: 46px; height: 61px; object-fit: cover; border-radius: 6px; display: block;
      background: var(--panel-2); box-shadow: 0 1px 3px rgba(0,0,0,.45);
      opacity: 0; transition: opacity .25s ease;
    }
    .cover-img.ready { opacity: 1; }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 999px; color: #fff; text-transform: uppercase; letter-spacing: .03em;
    }
    .badge.ultranx { background: var(--ultranx); }
    .badge.magicmonkei { background: var(--magicmonkei); }
    .badge.dossier { background: #64748b; }

    /* Regroupement (stacking) par Title ID */
    .stack-caret {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 11px; padding: 0 8px 0 0; transition: transform .15s ease; line-height: 1;
    }
    .stack-caret.open { transform: rotate(90deg); color: var(--text); }
    .stack-caret.spacer { visibility: hidden; cursor: default; }
    .vbadge {
      display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700;
      padding: 1px 7px; border-radius: 999px; background: var(--panel-2);
      border: 1px solid var(--border); color: var(--muted); vertical-align: middle; white-space: nowrap;
    }
    .vbadge.upd { color: #93c5fd; border-color: #31507e; }
    .vbadge.dlc { color: #fca5a5; border-color: #7e3131; }
    .drawer-row > td { padding: 0; background: #12151b; }
    .drawer { padding: 8px 14px 12px 54px; display: flex; flex-direction: column; gap: 7px; }
    .variant { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .variant .vname { color: var(--muted); flex: 1; word-break: break-word; }
    .variant .vsize { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .variant .btn { padding: 5px 10px; font-size: 12px; }
    .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; min-width: 62px; text-align: center; }
    .tag.base { background: #14532d; color: #bbf7d0; }
    .tag.update { background: #1e3a8a; color: #bfdbfe; }
    .tag.dlc { background: #7c2d12; color: #fed7aa; }

    .state { text-align: center; color: var(--muted); padding: 40px 10px; }
    .state.error { color: #f87171; }
    .count { color: var(--muted); font-size: 13px; margin-left: auto; }
    .capped { color: #eab308; }
    a.plain { color: var(--accent); text-decoration: none; }
    a.plain:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>🎮 Tinfoil Proxy — Médiathèque</h1>
      <div class="sub">Navigation, jaquettes et téléchargement manuel du dépôt unifié (UltraNX + Magic Monkei).</div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filtrer par nom…" autocomplete="off" />
      <select id="console"><option value="">Toutes les consoles</option></select>
      <button id="reload" class="btn ghost">↻ Rafraîchir</button>
      <span id="count" class="count"></span>
    </div>
    <div id="crumbs" class="crumbs"></div>
    <div id="content"><div class="state">Chargement du catalogue…</div></div>
  </main>

  <script>
    'use strict';

    // Au-delà de ce nombre de lignes, on tronque l'affichage (le DOM n'aime pas
    // 72 000 lignes). L'utilisateur affine via le filtre nom / la console.
    const MAX_RENDER = 1500;

    // Placeholder SVG (élégant, sobre) affiché pendant le chargement / si IGDB
    // ne trouve rien.
    const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='92' height='122' viewBox='0 0 92 122'>" +
      "<rect width='92' height='122' rx='10' fill='#1b1f27'/>" +
      "<rect x='.5' y='.5' width='91' height='121' rx='9.5' fill='none' stroke='#2a2f3a'/>" +
      "<g transform='translate(46 54)' fill='none' stroke='#4b5468' stroke-width='3' stroke-linecap='round'>" +
      "<rect x='-24' y='-12' width='48' height='24' rx='12'/>" +
      "<line x1='-14' y1='-4' x2='-14' y2='6'/><line x1='-19' y1='1' x2='-9' y2='1'/>" +
      "<circle cx='13' cy='-2' r='2.6' fill='#4b5468' stroke='none'/>" +
      "<circle cx='18' cy='3' r='2.6' fill='#4b5468' stroke='none'/></g>" +
      "<text x='46' y='98' text-anchor='middle' font-family='sans-serif' font-size='9' fill='#5b6473'>jaquette</text></svg>"
    );

    const history = [{ url: '/', title: 'Racine' }];
    let currentItems = { files: [], directories: [] };
    let coverObserver = null;
    const coverCache = new Map(); // nom -> url|null (mémoïsation client)
    const expandedGroups = new Set(); // clés de groupes (Title ID base) dépliés
    let allEntries = []; // entrées regroupées (calculées une fois par chargement)

    // --- Utilitaires -------------------------------------------------------

    function formatSize(bytes) {
      const n = Number(bytes);
      if (!Number.isFinite(n) || n <= 0) return '—';
      const units = ['o', 'Ko', 'Mo', 'Go', 'To'];
      let i = 0, v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function b64urlDecode(s) {
      try {
        let b64 = s.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        return decodeURIComponent(escape(atob(b64)));
      } catch { return ''; }
    }

    // Déduit chemin relatif, source, et nom lisible depuis /download|index/<src>/<token>.
    function describe(rawUrl, providedName) {
      const path = new URL(rawUrl, location.origin).pathname;
      const parts = path.split('/').filter(Boolean);
      const source = parts[1] || '';
      let name = (providedName || '').trim();
      if (!name) {
        const ref = b64urlDecode(parts[2] || '');
        const hash = ref.indexOf('#');
        let cand = hash >= 0 ? ref.slice(hash + 1) : ref.split('?')[0];
        cand = cand.split('/').filter(Boolean).pop() || '';
        try { cand = decodeURIComponent(cand); } catch { /* garde brut */ }
        name = cand.trim() || '(sans nom)';
      }
      return { name, source, path };
    }

    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    // --- Regroupement par Title ID Nintendo Switch -------------------------

    // Nettoie un titre : retire extension, [titleid], [vN], (Region)…
    function cleanTitle(name) {
      return String(name)
        .replace(/\.[a-z0-9]{2,4}$/i, '')
        .replace(/\[[^\]]*\]/g, ' ')
        .replace(/\([^)]*\)/g, ' ')
        .replace(/\s+/g, ' ')
        .trim() || String(name);
    }

    // Title ID = 16 hexa dans le nom (souvent entre crochets, ex. [0100…]).
    function extractTitleId(name) {
      const m = String(name).match(/([0-9a-fA-F]{16})/);
      return m ? m[1].toUpperCase() : '';
    }
    function extractVersion(name) {
      const m = String(name).match(/\[v(\d+)\]/i);
      return m ? parseInt(m[1], 10) : 0;
    }
    // Base du groupe : on efface les 13 bits de poids faible → base, MAJ (…800)
    // et DLC (…1000+) d'un même jeu partagent la même clé.
    function baseTitleId(tid) {
      try { return (BigInt('0x' + tid) & 0xFFFFFFFFFFFFE000n).toString(16).padStart(16, '0').toUpperCase(); }
      catch { return tid; }
    }
    // Type d'après les 13 bits de poids faible : base (0), MAJ (0x800), DLC (≥0x1000).
    function tidType(tid) {
      try {
        const low = BigInt('0x' + tid) & 0x1FFFn;
        if (low === 0n) return 'base';
        if (low === 0x800n) return 'update';
        return 'dlc';
      } catch { return 'base'; }
    }

    // Métadonnées d'un fichier de l'index.
    function fileMeta(f) {
      const path = new URL(f.url, location.origin).pathname;
      const source = path.split('/').filter(Boolean)[1] || '';
      const name = f.name || f.title || describe(f.url, '').name;
      const titleId = extractTitleId(name);
      return {
        url: path, name, source, size: f.size,
        console: f.console || '', titleId, version: extractVersion(name),
        type: titleId ? tidType(titleId) : 'base',
      };
    }

    // Construit les entrées d'affichage : jeux Switch regroupés par Title ID,
    // le reste (rétro sans Title ID) en lignes autonomes.
    function buildEntries(files) {
      const groups = new Map();
      const entries = [];
      for (const f of files) {
        const m = fileMeta(f);
        if (!m.titleId) {
          entries.push({ solo: true, main: m, title: cleanTitle(m.name), console: m.console, source: m.source, variants: [m] });
          continue;
        }
        const key = baseTitleId(m.titleId);
        let g = groups.get(key);
        if (!g) { g = { key, all: [] }; groups.set(key, g); entries.push({ group: g }); }
        g.all.push(m);
      }
      for (const e of entries) {
        if (!e.group) continue;
        const all = e.group.all;
        const base = all.find((m) => m.type === 'base');
        const updates = all.filter((m) => m.type === 'update').sort((a, b) => b.version - a.version);
        const dlcs = all.filter((m) => m.type === 'dlc');
        const main = base || updates[0] || all[0];
        // Variantes ordonnées : base, MAJ (récentes d'abord), DLC.
        const variants = [...(base ? [base] : []), ...updates, ...dlcs];
        e.key = e.group.key;
        e.main = main;
        e.title = cleanTitle((base || main).name);
        e.console = main.console;
        e.source = main.source;
        e.updates = updates;
        e.dlcs = dlcs;
        e.variants = variants;
        e.latestVersion = updates.length ? updates[0].version : 0;
      }
      return entries;
    }

    // --- Jaquettes (lazy-loading via IntersectionObserver) -----------------

    function setupCoverObserver() {
      if (coverObserver) coverObserver.disconnect();
      coverObserver = new IntersectionObserver((entries, obs) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          obs.unobserve(e.target);
          loadCover(e.target);
        }
      }, { rootMargin: '300px' });
    }

    async function loadCover(img) {
      const name = img.dataset.name;
      if (!name) return;
      if (coverCache.has(name)) return applyCover(img, coverCache.get(name));
      try {
        const res = await fetch('/api/cover?name=' + encodeURIComponent(name));
        const data = await res.json();
        const url = data && data.cover ? data.cover : null;
        coverCache.set(name, url);
        applyCover(img, url);
      } catch { /* garde le placeholder */ }
    }

    function applyCover(img, url) {
      if (url) {
        const real = new Image();
        real.onload = () => { img.src = url; img.classList.add('ready'); };
        real.onerror = () => { img.classList.add('ready'); };
        real.src = url;
      } else {
        img.classList.add('ready'); // reste le placeholder, mais visible
      }
    }

    // --- Console (menu déroulant dynamique) --------------------------------

    function populateConsoles() {
      const select = document.getElementById('console');
      const current = select.value;
      const consoles = [...new Set(
        currentItems.files.map((f) => (f.console || '').trim()).filter(Boolean),
      )].sort((a, b) => a.localeCompare(b, 'fr'));
      select.innerHTML =
        '<option value="">Toutes les consoles</option>' +
        consoles.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      // Conserve la sélection si elle existe encore.
      if (consoles.includes(current)) select.value = current;
    }

    // --- Chargement & rendu ------------------------------------------------

    async function load(url) {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="state">Chargement…</div>';
      try {
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        currentItems = {
          files: Array.isArray(data.files) ? data.files : [],
          directories: Array.isArray(data.directories) ? data.directories : [],
        };
        expandedGroups.clear();
        allEntries = buildEntries(currentItems.files);
        populateConsoles();
        render();
      } catch (err) {
        content.innerHTML = `<div class="state error">Échec du chargement : ${escapeHtml(err.message)}</div>`;
        document.getElementById('count').textContent = '';
      }
    }

    // Ligne « variante » dans le tiroir (base / MàJ / DLC).
    function variantRow(v) {
      const label = v.type === 'update' ? 'MàJ' : v.type === 'dlc' ? 'DLC' : 'Base';
      return `<div class="variant">
        <span class="tag ${v.type}">${label}</span>
        <span class="vname">${escapeHtml(v.name)}</span>
        <span class="vsize">${formatSize(v.size)}</span>
        <a class="btn" href="${escapeHtml(v.url)}">Télécharger</a>
      </div>`;
    }

    function render() {
      const filter = document.getElementById('filter').value.trim().toLowerCase();
      const consoleFilter = document.getElementById('console').value;
      const content = document.getElementById('content');

      // Dossiers (masqués si un filtre console est actif).
      const dirs = consoleFilter ? [] : currentItems.directories
        .map((d) => {
          const raw = typeof d === 'string' ? d : d.url;
          if (!raw) return null;
          const info = describe(raw, typeof d === 'object' ? (d.name || d.title) : '');
          return { isDir: true, path: info.path, name: info.name };
        })
        .filter(Boolean)
        .filter((d) => !filter || d.name.toLowerCase().includes(filter));

      // Jeux regroupés, filtrés par nom (titre ou variante) et par console.
      const games = allEntries.filter((e) => {
        if (consoleFilter && e.console !== consoleFilter) return false;
        if (!filter) return true;
        if (e.title.toLowerCase().includes(filter)) return true;
        return e.variants.some((v) => v.name.toLowerCase().includes(filter));
      });

      const list = [...dirs, ...games];
      const total = list.length;
      const shown = list.slice(0, MAX_RENDER);

      renderCrumbs();
      const countEl = document.getElementById('count');
      if (total > shown.length) {
        countEl.innerHTML = `<span class="capped">${shown.length} affichés / ${total}</span> — affinez le filtre`;
      } else {
        countEl.textContent = `${total} jeu${total > 1 ? 'x' : ''}`;
      }

      if (shown.length === 0) {
        content.innerHTML = '<div class="state">Aucun élément à afficher.</div>';
        return;
      }

      const body = shown.map((it) => {
        if (it.isDir) {
          return `<tr>
            <td class="cover-cell"><div style="width:46px"></div></td>
            <td class="name"><span class="stack-caret spacer">▶</span><a class="folder" data-url="${escapeHtml(it.path)}" data-title="${escapeHtml(it.name)}">📁 ${escapeHtml(it.name)}</a></td>
            <td class="console-cell"></td>
            <td><span class="badge dossier">Dossier</span></td>
            <td class="size"></td>
            <td class="actions"><button class="btn ghost" data-url="${escapeHtml(it.path)}" data-title="${escapeHtml(it.name)}">Ouvrir</button></td>
          </tr>`;
        }
        const e = it;
        const hasVariants = e.variants.length > 1;
        const open = expandedGroups.has(e.key);
        const caret = hasVariants
          ? `<button class="stack-caret ${open ? 'open' : ''}" data-caret="${escapeHtml(e.key)}" title="Afficher les MàJ / DLC">▶</button>`
          : '<span class="stack-caret spacer">▶</span>';
        const badges =
          (e.latestVersion ? `<span class="vbadge upd">MàJ v${e.latestVersion}</span>` : '') +
          (e.dlcs.length ? `<span class="vbadge dlc">${e.dlcs.length} DLC</span>` : '') +
          (e.updates.length ? `<span class="vbadge">${e.updates.length} version${e.updates.length > 1 ? 's' : ''}</span>` : '');
        const main = `<tr>
          <td class="cover-cell"><img class="cover-img" data-name="${escapeHtml(e.title)}" src="${PLACEHOLDER}" alt="" loading="lazy" /></td>
          <td class="name">${caret}${escapeHtml(e.title)}${badges}</td>
          <td class="console-cell">${escapeHtml(e.console || '')}</td>
          <td><span class="badge ${e.source}">${escapeHtml(e.source)}</span></td>
          <td class="size">${formatSize(e.main.size)}</td>
          <td class="actions"><a class="btn" href="${escapeHtml(e.main.url)}">Télécharger</a></td>
        </tr>`;
        const drawer = hasVariants
          ? `<tr class="drawer-row" data-drawer="${escapeHtml(e.key)}" ${open ? '' : 'hidden'}>
              <td colspan="6"><div class="drawer">${e.variants.map(variantRow).join('')}</div></td>
            </tr>`
          : '';
        return main + drawer;
      }).join('');

      content.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>Jaquette</th><th>Nom</th><th>Console</th><th>Source</th><th>Taille</th><th></th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>`;

      // Navigation dans les dossiers.
      content.querySelectorAll('button[data-url], a.folder[data-url]').forEach((el) => {
        el.addEventListener('click', () => enterDir(el.dataset.url, el.dataset.title));
      });

      // Dépliage des tiroirs (MàJ / DLC).
      content.querySelectorAll('.stack-caret[data-caret]').forEach((btn) => {
        btn.addEventListener('click', () => toggleGroup(btn.dataset.caret, btn));
      });

      // Lazy-loading des jaquettes : on observe les <img> rendues.
      setupCoverObserver();
      content.querySelectorAll('img.cover-img').forEach((img) => coverObserver.observe(img));
    }

    function toggleGroup(key, btn) {
      const drawer = document.querySelector(`.drawer-row[data-drawer="${CSS.escape(key)}"]`);
      const open = !expandedGroups.has(key);
      if (open) expandedGroups.add(key); else expandedGroups.delete(key);
      btn.classList.toggle('open', open);
      if (drawer) drawer.hidden = !open;
    }

    function renderCrumbs() {
      const el = document.getElementById('crumbs');
      const parts = history.map((h, i) => {
        const label = i === history.length - 1 ? `<b>${escapeHtml(h.title)}</b>` : escapeHtml(h.title);
        return `<a class="plain" data-idx="${i}">${label}</a>`;
      });
      el.innerHTML = parts.join(' <span style="opacity:.5">/</span> ');
      el.querySelectorAll('[data-idx]').forEach((a) => {
        a.addEventListener('click', () => goTo(Number(a.dataset.idx)));
      });
    }

    function enterDir(url, title) { history.push({ url, title }); load(url); }
    function goTo(idx) { history.splice(idx + 1); load(history[idx].url); }

    // --- Événements globaux ------------------------------------------------
    let filterTimer;
    document.getElementById('filter').addEventListener('input', () => {
      clearTimeout(filterTimer);
      filterTimer = setTimeout(render, 220); // debounce (72k lignes)
    });
    document.getElementById('console').addEventListener('change', render);
    document.getElementById('reload').addEventListener('click', () => load(history[history.length - 1].url));

    load('/');
  </script>
</body>
</html>
