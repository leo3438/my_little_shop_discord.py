# Mock retroarch.cfg (subset of the keys RetroArch for Switch writes).
# Hand-written comments like these must survive RetroManager's edits.

## --- Paths ---
libretro_directory = "/retroarch/cores"
system_directory = "/retroarch/system"
savefile_directory = "/retroarch/saves"
savestate_directory = "/retroarch/states"
cheat_database_path = "/retroarch/cheats"
thumbnails_directory = "/retroarch/thumbnails"
playlist_directory = "/retroarch/playlists"
rgui_config_directory = "/retroarch/config"
rgui_browser_directory = "default"

## --- Video (tuned by hand, do not touch) ---
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "false"
input_menu_toggle_gamepad_combo = "2"
menu_driver = "ozone"
