name: RetroManager

on:
  push:
    paths: ["retromanager/**", ".github/workflows/retromanager.yml"]
  pull_request:
    paths: ["retromanager/**", ".github/workflows/retromanager.yml"]

defaults:
  run:
    working-directory: retromanager

jobs:
  forwarder-stub:
    name: Forwarder stub (main + main.npdm)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
      - name: Build (nx-hbloader + RetroManager patch)
        run: tools/forwarder-stub/build.sh build/forwarder-stub
      - uses: actions/upload-artifact@v4
        with:
          name: stub
          path: retromanager/build/forwarder-stub/

  tests:
    name: Unit tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    needs: forwarder-stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stub
          path: ${{ runner.temp }}/stub-artifact
      - name: Use the built forwarder stub in the tests
        run: echo "RM_TEST_STUB_DIR=$RUNNER_TEMP/stub-artifact/stub" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev samba smbclient
          pip install pyftpdlib pyopenssl
      - name: Configure
        run: cmake --preset tests -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build --preset tests -j
      - name: Start the test FTP, FTPS and HTTP servers
        run: |
          python3 tools/test_ftp_server.py --port-file "$RUNNER_TEMP/ftp.port" \
            --ftps-port-file "$RUNNER_TEMP/ftps.port" --http-port-file "$RUNNER_TEMP/http.port" \
            > "$RUNNER_TEMP/ftp.log" 2>&1 &
          for i in $(seq 1 120); do [ -s "$RUNNER_TEMP/ftp.port" ] && break; sleep 0.25; done
          test -s "$RUNNER_TEMP/ftp.port" || { cat "$RUNNER_TEMP/ftp.log"; exit 1; }
          echo "RM_TEST_FTP_PORT=$(cat "$RUNNER_TEMP/ftp.port")" >> "$GITHUB_ENV"
          echo "RM_TEST_FTPS_PORT=$(cat "$RUNNER_TEMP/ftps.port")" >> "$GITHUB_ENV"
          echo "RM_TEST_HTTP_PORT=$(cat "$RUNNER_TEMP/http.port")" >> "$GITHUB_ENV"
      - name: Start the test SMB server (Samba defaults, SMB2 minimum like a NAS)
        run: |
          sudo tools/test_smb_server.sh 4450 /tmp/rm-smb
          echo "RM_TEST_SMB_PORT=4450" >> "$GITHUB_ENV"
      - name: Build hactool (independent check of the generated NSPs)
        run: |
          git clone https://github.com/SciresM/hactool.git "$RUNNER_TEMP/hactool"
          git -C "$RUNNER_TEMP/hactool" checkout 1d64a83450e025622f3468c28fc4164dad2c5ef6
          cp "$RUNNER_TEMP/hactool/config.mk.template" "$RUNNER_TEMP/hactool/config.mk"
          make -C "$RUNNER_TEMP/hactool" -j"$(nproc)"
          echo "RM_HACTOOL=$RUNNER_TEMP/hactool/hactool" >> "$GITHUB_ENV"
      - name: Test (FTP/FTPS/HTTP/SMB integration, hactool and forwarder stub checks included)
        run: ctest --preset tests

  tests-bundled-curl:
    name: Unit tests (libcurl built from source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset tests -DRM_FETCH_CURL=ON
      - name: Build
        run: cmake --build --preset tests -j
      - name: Test
        run: ctest --preset tests

  desktop:
    name: Desktop app (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config libcurl4-openssl-dev
      - name: Configure
        run: cmake --preset desktop
      - name: Build
        run: cmake --build --preset desktop -j
      - name: Test
        run: ctest --preset desktop

  switch:
    name: Nintendo Switch (.nro)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset switch
      - name: Build
        run: cmake --build --preset switch -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: RetroManager-nro
          path: retromanager/build/switch/RetroManager.nro
